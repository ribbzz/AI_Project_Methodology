[tool.poetry]
name = "ecommerce-churn"
version = "1.0.0"
description = "Customer churn prediction for an e-commerce marketplace - EPITA AI Project Methodology 2026, graded project part 2."
authors = [
    "Rabeeh Abou Ismail",
    "Amjad Bsat",
    "Majd Hammoud",
]
readme = "README.md"
license = "MIT"
packages = [{ include = "churn", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
pandas = ">=2.2,<3"
numpy = ">=2.1,<3"
scikit-learn = ">=1.5,<2"
lightgbm = ">=4.5,<5"
mlflow = ">=3.1,<4"
matplotlib = ">=3.9,<4"
shap = ">=0.46"
openpyxl = ">=3.1,<4"
pyarrow = ">=17"
joblib = ">=1.4"
uvicorn = ">=0.30"
fastapi = ">=0.110"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=5.0"
black = ">=24.8"
flake8 = ">=7.1"
pylint = ">=3.2"
sphinx = ">=8.0"
sphinx-rtd-theme = ">=2.0"

[tool.poetry.scripts]
churn-data = "churn.data.make_dataset:main"
churn-features = "churn.features.build_features:main"
churn-train = "churn.models.train_model:main"
churn-predict = "churn.models.predict_model:main"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
