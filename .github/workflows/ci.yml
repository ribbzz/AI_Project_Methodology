name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Check formatting (black)
        run: black --check src tests scripts

      - name: Lint (flake8)
        run: flake8 src tests

      - name: Lint (pylint)
        run: pylint src/churn

      - name: Run tests
        run: pytest --cov=churn --cov-report=term-missing

      - name: Build documentation
        run: sphinx-build -b html docs/source docs/build -W --keep-going
